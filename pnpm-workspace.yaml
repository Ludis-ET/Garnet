packages:
  - packages/*
  - spikes/*

# One version of each shared tool across the workspace. Reference with "catalog:".
catalog:
  "@electric-sql/pglite": ^0.5.8
  fast-check: ^4.10.0
  temporal-polyfill: ^1.0.5
  typescript: ~6.0.3
  vitest: ^5.0.3

# Supply-chain hygiene: never resolve a version published less than 7 days ago.
minimumReleaseAge: 10080

# pnpm 10 blocks dependency lifecycle scripts by default. Allow-list explicitly when needed.
onlyBuiltDependencies: []
