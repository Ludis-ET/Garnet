name: Deploy to cPanel

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy API
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Standalone API Package
        run: |
          # 1. Compile API and migration runner into apps/api/dist
          pnpm --filter @garnet/api run build

          # 2. Prepare standalone deployment bundle with flat production dependencies (no symlinks)
          rm -rf deploy-bundle
          mkdir -p deploy-bundle
          cp apps/api/dist/package.json deploy-bundle/package.json
          cd deploy-bundle
          npm install --omit=dev --no-audit --no-fund
          cd ..

          # 3. Copy compiled dist artifacts & passenger app.js into the deployment bundle
          cp -r apps/api/dist deploy-bundle/dist
          cp apps/api/app.js deploy-bundle/app.js

          # 4. Create Passenger restart signal so the app reloads on upload
          mkdir -p deploy-bundle/tmp
          date -u > deploy-bundle/tmp/restart.txt

      - name: Prepare Server Host
        id: server-info
        run: |
          RAW_SERVER="${{ secrets.SERVER }}"
          # Clean protocol (https://, ftp://), trailing slashes, paths, ports and whitespace
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -E 's|^[a-zA-Z]+://||' | sed -E 's|/.*$||' | sed -E 's|:[0-9]+$||' | tr -d ' \r\n\t')
          echo "host=$CLEAN_SERVER" >> "$GITHUB_OUTPUT"

      - name: Sync Release to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.server-info.outputs.host }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT || 21 }}
          protocol: ftp
          server-dir: ./
          local-dir: ./deploy-bundle/
          dangerous-clean-slate: false
